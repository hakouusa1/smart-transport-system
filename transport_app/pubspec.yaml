name: transporteur_app
description: Transport Management System - Owner App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_functions: ^5.2.2
  cloud_firestore: ^5.6.0
  uuid: ^4.5.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.1
  firebase_database: ^11.3.3
  intl: ^0.20.2
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^17.2.4
  supabase_flutter: ^2.9.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.5
  fl_chart: ^0.69.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/massar_logo.png"
  web:
    generate: true
    image_path: "assets/images/massar_logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/massar_logo_splash.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#FFFFFF"
    image: assets/images/massar_logo_splash_android12.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/